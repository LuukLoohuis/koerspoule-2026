<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="title">
  <title id="title">Koerspoule Vuelta a España</title>
  <defs>
    <filter id="vuelta-accent" color-interpolation-filters="sRGB">
      <!-- Geel/goud -> rood (#e30613); zwart, wit en neutraalgrijs blijven gelijk. -->
      <feColorMatrix type="matrix" values="
        .89 0 .11 0 0
        0 .025 .975 0 0
        .07 0 .93 0 0
        0 0 0 1 0"/>
    </filter>
    <clipPath id="shield-flag">
      <path d="M168 230H312L298 263Q271 285 240 296Q209 285 182 263Z"/>
    </clipPath>
    <linearGradient id="flag-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".34" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <image href="koerspoule-logo-2026.png" width="480" height="320" filter="url(#vuelta-accent)"/>
  <g clip-path="url(#shield-flag)">
    <rect x="168" y="230" width="144" height="16.5" fill="#AA151B"/>
    <rect x="168" y="246.5" width="144" height="33" fill="#F1BF00"/>
    <rect x="168" y="279.5" width="144" height="16.5" fill="#AA151B"/>
    <rect x="168" y="230" width="144" height="66" fill="url(#flag-shine)"/>
  </g>
</svg>
