<script type="text/x-dc" data-dc-script data-props='{"actief":{"editor":"enum","options":["krant","ploeg","subpoule","uitslagen","hors"],"default":"krant"},"$preview":{"width":375,"height":60}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.actief ?? 'krant';
const mk = (k) => {
const on = a === k;
return {
color: on ? 'hsl(335 70% 45%)' : 'hsl(240 8% 46%)',
pill: on ? 'rgba(230, 68, 109, 0.12)' : 'transparent',
stamp: on ? '#c8a020' : 'transparent',
sw: on ? 2.5 : 1.75,
cur: on ? 'page' : 'false'
};
};
return { krant: mk('krant'), ploeg: mk('ploeg'), subpoule: mk('subpoule'), uitslagen: mk('uitslagen'), hors: mk('hors') };
}
}
</script>
