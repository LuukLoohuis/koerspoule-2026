    <!-- No-flash thema: zet vóór de eerste paint het laatst-bekende thema
         (of race-neutraal bij eerste bezoek), zodat de Giro-roze base nooit flitst. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var r = d.style;
          var key = localStorage.getItem("koerspoule:themaKey");
          var raw = localStorage.getItem("koerspoule:themaTokens");
          if (key === "winter") {
            // Winter haalt al zijn kleuren uit de CSS; het attribuut volstaat.
            d.setAttribute("data-thema", "winter");
            if (localStorage.getItem("koerspoule:modus") === "nacht") d.setAttribute("data-modus", "nacht");
          } else if (raw) {
            var t = JSON.parse(raw);
            for (var k in t) { if (t[k]) r.setProperty(k, t[k]); }
            if (key === "roze" || key === "geel" || key === "rood") d.setAttribute("data-thema", key);
          } else {
            var n = "38 10% 55%";
            r.setProperty("--primary", n);
            r.setProperty("--ring", n);
            r.setProperty("--jersey-pink", n);
            r.setProperty("--sidebar-primary", n);
            r.setProperty("--sidebar-ring", n);
          }
          // Adres-/statusbalk van de browser: laatst-bekende koptekstkleur.
          var tc = localStorage.getItem("koerspoule:themeColor");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (tc && meta) meta.setAttribute("content", tc);
        } catch (e) {}
      })();
    </script>
